<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Menlo, Consolas, monospace" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="bold" fill="#1a1a1a">PSP2DC adapter on a Waveshare RP2040-Zero</text>
<text x="20" y="50" fill="#6b6b6b">Seen from above, USB-C at the top. The same wiring as USB4Maple; every pin is free (no buffers).</text>
<rect x="330" y="90" width="230" height="300" rx="8" fill="#1f3c88" stroke="#0e1f4d" stroke-width="2"/>
<rect x="410" y="72" width="70" height="40" rx="6" fill="#bdbdbd" stroke="#555"/>
<text x="445" y="94" text-anchor="middle" font-size="11" fill="#222">USB-C</text>
<text x="445" y="126" text-anchor="middle" font-size="11" fill="#fff">to the PSP</text>
<rect x="432" y="220" width="64" height="64" fill="#111"/>
<text x="464" y="256" text-anchor="middle" fill="#ddd" font-size="12">RP2040</text>
<rect x="458" y="168" width="10" height="10" fill="#f5f5f5" stroke="#333"/>
<text x="463" y="194" text-anchor="middle" fill="#fff" font-size="10">WS2812 (GP16)</text>
<text x="430" y="154" text-anchor="middle" fill="#fff" font-size="10">BOOT</text>
<text x="495" y="154" text-anchor="middle" fill="#fff" font-size="10">RESET</text>
<circle cx="340" cy="120" r="7" fill="#f5d76e" stroke="#8a6d00"/>
