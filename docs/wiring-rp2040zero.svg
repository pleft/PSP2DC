<text x="570" y="184" fill="#1e8449">GP2</text>
<circle cx="550" cy="210" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="570" y="214" fill="#1e8449">GP3</text>
<circle cx="550" cy="240" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="570" y="244" fill="#1e8449">GP4</text>
<circle cx="550" cy="270" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="570" y="274" fill="#1e8449">GP5</text>
<circle cx="550" cy="300" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="570" y="304" fill="#1e8449">GP6</text>
<circle cx="550" cy="330" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="570" y="334" fill="#1e8449">GP7</text>
<circle cx="550" cy="360" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="570" y="364" fill="#1e8449">GP8</text>
<circle cx="380" cy="380" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="380" y="406" text-anchor="middle" fill="#1e8449" font-size="11">13</text>
<circle cx="412" cy="380" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="412" y="406" text-anchor="middle" fill="#1e8449" font-size="11">12</text>
<circle cx="444" cy="380" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="444" y="406" text-anchor="middle" fill="#1e8449" font-size="11">11</text>
<circle cx="476" cy="380" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="476" y="406" text-anchor="middle" fill="#1e8449" font-size="11">10</text>
<circle cx="508" cy="380" r="7" fill="#f5d76e" stroke="#8a6d00"/>
<text x="508" y="406" text-anchor="middle" fill="#1e8449" font-size="11">9</text>
<text x="445" y="422" text-anchor="middle" fill="#6b6b6b" font-size="11">GP13..GP9 along the bottom edge</text>
<rect x="20" y="76" width="220" height="300" rx="8" fill="#f2f2f2" stroke="#555" stroke-width="2"/>
<text x="32" y="98" font-weight="bold" fill="#1a1a1a">Dreamcast controller plug</text>
<polyline points="240,120 333,120" fill="none" stroke="#555555" stroke-width="5"/>
<polyline points="240,120 333,120" fill="none" stroke="#1f5fbf" stroke-width="3"/>
<circle cx="34" cy="120" r="6" fill="#1f5fbf" stroke="#555" stroke-width="1.5"/>
<text x="48" y="124" fill="#1a1a1a"><tspan font-weight="bold">blue</tspan> +5 V</text>
<polyline points="240,150 333,150" fill="none" stroke="#555555" stroke-width="5"/>
<polyline points="240,150 333,150" fill="none" stroke="#111111" stroke-width="3"/>
<circle cx="34" cy="150" r="6" fill="#111111" stroke="#555" stroke-width="1.5"/>
<text x="48" y="154" fill="#1a1a1a"><tspan font-weight="bold">black</tspan> ground</text>
<polyline points="240,180 300,180 300,155 333,155" fill="none" stroke="#555555" stroke-width="5"/>
<polyline points="240,180 300,180 300,155 333,155" fill="none" stroke="#2e9e44" stroke-width="3"/>
<circle cx="34" cy="180" r="6" fill="#2e9e44" stroke="#555" stroke-width="1.5"/>
<text x="48" y="184" fill="#1a1a1a"><tspan font-weight="bold">green</tspan> ground (sense)</text>
<polyline points="240,330 333,330" fill="none" stroke="#555555" stroke-width="5"/>
<polyline points="240,330 333,330" fill="none" stroke="#ffffff" stroke-width="3"/>
<circle cx="34" cy="330" r="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="48" y="334" fill="#1a1a1a"><tspan font-weight="bold">white</tspan> data B (pin 5)</text>
<polyline points="240,360 333,360" fill="none" stroke="#555555" stroke-width="5"/>
<polyline points="240,360 333,360" fill="none" stroke="#d62828" stroke-width="3"/>
<circle cx="34" cy="360" r="6" fill="#d62828" stroke="#555" stroke-width="1.5"/>
<text x="48" y="364" fill="#1a1a1a"><tspan font-weight="bold">red</tspan> data A (pin 1)</text>
<text x="20" y="470" fill="#1a1a1a">The 5V pin and the USB-C VBUS are one net (Waveshare schematic): the Dreamcast's 5 V</text>
<text x="20" y="488" fill="#1a1a1a">powers the board and the PSP's USB port. So never plug the USB-C into a computer while the Dreamcast powers it:</text>
<text x="20" y="506" fill="#1a1a1a">unplug the Dreamcast to flash it.</text>
<text x="20" y="528" fill="#1a1a1a">One GND edge pin: both grounds go there (or one to the GND pad underneath). Data A/B: GP14/GP15 (MAPLE_PIN1/5).</text>
</svg>
