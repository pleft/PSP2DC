<text x="260" y="250" text-anchor="end" fill="#c0392b">never outputs</text>
<rect x="740" y="282" width="230" height="166" rx="8" fill="#f2f2f2" stroke="#555" stroke-width="2"/>
<text x="752" y="306" font-weight="bold" fill="#1a1a1a">Dreamcast controller plug</text>
<polyline points="620,122 690,122 690,338 740,338" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="754" cy="338" r="6" fill="#c0392b"/>
<text x="768" y="342" fill="#c0392b" font-weight="bold">+5 V</text>
<line x1="620" y1="386" x2="740" y2="386" stroke="#1f5fbf" stroke-width="2.5"/>
<circle cx="754" cy="386" r="6" fill="#1f5fbf"/>
<text x="768" y="390" fill="#1f5fbf" font-weight="bold">data B (pin 5)</text>
<line x1="620" y1="410" x2="740" y2="410" stroke="#333333" stroke-width="2.5"/>
<circle cx="754" cy="410" r="6" fill="#333333"/>
<text x="768" y="414" fill="#333333" font-weight="bold">ground</text>
<line x1="620" y1="434" x2="740" y2="434" stroke="#1f5fbf" stroke-width="2.5"/>
<circle cx="754" cy="434" r="6" fill="#1f5fbf"/>
<text x="768" y="438" fill="#1f5fbf" font-weight="bold">data A (pin 1)</text>
<line x1="620" y1="458" x2="740" y2="458" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="6,4"/>
<text x="620" y="480" fill="#1f5fbf">optional debug log: to a 3.3 V</text>
<text x="620" y="496" fill="#1f5fbf">USB-serial adapter's RX, 115200 8N1</text>
<text x="20" y="685" fill="#1f5fbf">■ wired</text>
<text x="110" y="685" fill="#1e8449">■ free (direct pins)</text>
<text x="290" y="685" fill="#c0392b">■ buffered on the SuperPico: never an output</text>
<text x="20" y="707" fill="#1a1a1a">+5 V from the Dreamcast goes to VBUS (pin 40): it powers the Pico and the USB port the PSP plugs into.</text>
<text x="20" y="725" fill="#1a1a1a">Ground: any of the Pico's GND pins (28 sits between the two data pins). Data A and B: GP21 and GP22,</text>
<text x="20" y="743" fill="#1a1a1a">consecutive GPIOs, as the Maple code needs (set at build time: MAPLE_PIN1=21, MAPLE_PIN5=22).</text>
</svg>
